<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc"><title id="title">Linux x86-64 system call flow</title><desc id="desc">Arguments pass from an application through glibc into kernel registers, a syscall handler runs, and the result returns to user space.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526171"/></marker></defs><rect width="1000" height="1100" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#182b40}.heading{font-size:23px;font-weight:bold}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.small{font-size:16px}.flow{fill:none;stroke:#526171;stroke-width:2;marker-end:url(#arrow)}</style><rect x="30" y="25" width="940" height="140" rx="8" fill="#ffe8cd"/><text x="55" y="62" class="heading">User application</text><text x="55" y="100" class="mono">open(pathname, flags, mode)</text><text x="55" y="138" class="body">System call name and arguments 1–6</text><text x="725" y="138" class="body">Return value</text><rect x="30" y="190" width="940" height="210" rx="8" fill="#fff3cc"/><text x="55" y="227" class="heading">glibc wrapper</text><text x="55" y="265" class="mono">DO_CALL(syscall_name, args)</text><text x="55" y="307" class="mono">Arguments → rdi, rsi, rdx, r10, r8, r9</text><text x="55" y="347" class="mono">System call number → rax</text><text x="55" y="380" class="body">Execute syscall instruction</text><text x="730" y="307" class="mono">Result in rax</text><rect x="30" y="425" width="940" height="640" rx="8" fill="#dceafb"/><text x="55" y="465" class="heading">Linux kernel</text><text x="55" y="510" class="mono">MSR_LSTAR → entry_SYSCALL_64</text><text x="55" y="550" class="body">Save register context in struct pt_regs</text><rect x="65" y="575" width="590" height="230" rx="8" fill="#ffffff"/><text x="85" y="610" class="mono">ss = __USER_DS: user data segment</text><text x="85" y="644" class="mono">sp: user stack pointer</text><text x="85" y="678" class="mono">flags = r11: CPU flags</text><text x="85" y="712" class="mono">cs = __USER_CS: user code segment</text><text x="85" y="746" class="mono">ip = rcx: return instruction pointer</text><text x="85" y="780" class="mono">orig_ax, di, si, dx, r10, r8, r9</text><text x="55" y="852" class="body">Dispatch by system call number</text><text x="55" y="890" class="mono">sys_call_table[orig_ax]</text><text x="55" y="935" class="body">Run the system call handler with arguments 1–6</text><text x="55" y="980" class="mono">Store return value in pt_regs.ax</text><text x="725" y="980" class="body">Restore registers</text><text x="725" y="1020" class="mono">sysretq</text><path d="M180 165V188" class="flow"/><path d="M180 400V423" class="flow"/><path d="M180 520V570" class="flow"/><path d="M180 805V830" class="flow"/><path d="M180 900V914" class="flow"/><path d="M460 990H705" class="flow"/><path d="M840 955V335" class="flow"/><path d="M840 277V163" class="flow"/></svg>
